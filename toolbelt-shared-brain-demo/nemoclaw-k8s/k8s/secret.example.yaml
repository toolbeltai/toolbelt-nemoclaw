# Copy to secret.yaml, fill in, apply. NEVER commit real values.
apiVersion: v1
kind: Secret
metadata: { name: demo-secrets, namespace: toolbelt-claw-demo }
type: Opaque
stringData:
  NEMOCLAW_PROVIDER_KEY: ""     # build.nvidia.com API key (Nemotron)
  TOOLBELT_TOKEN: ""           # Toolbelt token with owner/write on the namespace
---
apiVersion: v1
kind: ConfigMap
metadata: { name: demo-config, namespace: toolbelt-claw-demo }
data:
  NEMOCLAW_NON_INTERACTIVE: "1"
  NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
  NEMOCLAW_SANDBOX_NAME: "toolbelt"
  NEMOCLAW_PROVIDER: "build"
  NEMOCLAW_MODEL: "nvidia/llama-3.3-nemotron-super-49b-v1"   # must support TOOL CALLING
  TOOLBELT_HOST: "app.toolbelt.ai"
  # The shared brain. Create it + adopt the datasets OUT OF BAND first (see README), then put its id here:
  TOOLBELT_NAMESPACE: "REPLACE_WITH_NAMESPACE_UUID"
